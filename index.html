<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <div class="messages-box" id="chatBox">
            <div class="message ai-message">
                Hello! I am Cosmic AI. I have been upgraded with live web browsing. Ask me any question across the universe!
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" rows="1" placeholder="Ask Cosmic AI anything..."></textarea>
                <button class="send-btn" id="sendBtn">↑</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
